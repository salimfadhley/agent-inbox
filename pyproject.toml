[project]
# The project's true name, and the PyPI project that has always carried it. The import
# package, console script and environment prefix were brought into line in v0.25.0.
# The old names still work — `agent_mailbox` aliases to the same modules, `agent-mailbox`
# still runs, and `AGENT_MAILBOX_*` / `agent-mailbox.toml` are honoured as fallbacks —
# because they are baked into live deployments and into config files already written into
# other people's repositories.
name = "agent-inbox"
dynamic = ["version"]
description = "A SQLite mailbox for local LLM agents — one HTTP API, an ActivityStreams messaging model, and a local stdio MCP server so AI coding agents can message each other. No external services."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Sal Fadhley" },
]
keywords = [
    "agents",
    "llm",
    "mcp",
    "sqlite",
    "messaging",
    "inter-agent",
    "mailbox",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "aiosqlite>=0.20",
    # The CLI's parser. One pure-Python package (colorama on Windows is its only
    # requirement), and a base dependency rather than a client-only one because the
    # hub's own entry point runs through cli.py.
    "click>=8.1",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "litestar>=2.24.0",
    "msgspec>=0.21.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Client-side only (M3). The hub container does not carry these: mcp pulls in pydantic
# and starlette, which the API deliberately does not use (ADR 0009).
clients = [
    "mcp[cli]>=1.12",
    "httpx>=0.27",
]
# Vestigial. The console renders its own HTML and reaches the hub over urllib, so it
# needs nothing here — which is why the image, which carries no extras, can run it.
ui = [
    "jinja2>=3.1",
    "markdown>=3.6",
]

[project.scripts]
# One command, several modes: `agent-mailbox mcp`, `serve`, `join`, `inbox`, …
agent-mailbox = "agent_inbox.cli:main"
# The project's true name, and increasingly what people type. Both names run the same
# program; `agent-mailbox` stays because it is wired into deployments and hooks.
agent-inbox = "agent_inbox.cli:main"

[project.urls]
Homepage = "https://github.com/salimfadhley/agent-inbox"
Repository = "https://github.com/salimfadhley/agent-inbox"
Issues = "https://github.com/salimfadhley/agent-inbox/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_inbox", "src/agent_mailbox"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "doc", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "pyright>=1.1.350",
    # the [ui] extra, so the console tests can render
    "jinja2>=3.1",
    "markdown>=3.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-k auth` used to deselect all eleven live tests, because none of the three
# auth-relevant ones has "auth" in its name — and an empty selection reads exactly like
# a pass. `-k` matches markers as well as names, so the marker is what makes the obvious
# command work. Registered here so it does not warn.
markers = [
    "auth: a live test about the hub's authentication posture (tests/live)",
]
# `--capture=sys` is a workaround for an upstream bug, not a preference. Under the
# default fd-level capture, pytest 9.1.1 on CPython 3.14.2 fails a test roughly one full
# run in two with `UnicodeDecodeError: 'utf-8' codec can't decode byte 0x94 in position
# 0`, raised inside pytest's own `item_capture` teardown (_pytest/capture.py:899 →
# FDCapture.snap). 0x94 is the third byte of an em-dash (e2 80 94), which this codebase
# logs constantly — pytest's temp-file read/truncate cycle splits one across a boundary
# and then strict-decodes the tail. It never reproduces in isolation, never happens on
# 3.12, and lands on whichever test straddles the boundary rather than on a faulty one.
#
# Sys-level capture does not use that temp file: 10 consecutive full runs, zero failures.
# It is safe here because nothing in the suite requires fd-level capture — no test uses
# `capfd`, and no test spawns a real subprocess whose output is captured.
#
# Remove this when the upstream fix lands. Do not "fix" it by skipping the test that
# happens to fail; the test is fine, and the next boundary would move it elsewhere.
addopts = "-q --capture=sys"

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    # One-off build script, kept for provenance of the checked-in name pool. It is
    # never imported, never shipped, and depends on libraries we removed.
    "tools",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
