# NOT the source of truth. `../charter.md` is.
#
# This is the record of the bootstrap interview, and until 2026-08-01 it still described
# the system as it was before the 2026-07-24 rebuild: a NATS JetStream mailbox called
# `agent-mail`, published to GHCR, with per-agent `/<agent>/mcp` URLs. None of that has
# been true since ADRs 0003-0006. `charter.md` was hand-refreshed three times over that
# period and this file was not, so running `spec-kitty charter generate` would have
# rebuilt the charter from a description of a system that no longer exists.
#
# It has been brought back into line so that it is no longer a loaded gun, but the fix is
# the process rather than this file: edit `charter.md`, run `spec-kitty charter sync`,
# commit. Do not regenerate from here.
schema_version: "1.0.0"
mission: "software-dev"
profile: "comprehensive"
answers:
  project_intent: >
    agent-inbox is generic, releasable, open-source infrastructure (GPL-3.0-or-later,
    published to PyPI and as a Docker image on Docker Hub with a GHCR mirror): a
    SQLite-backed mailbox that lets local LLM coding agents (Claude, Codex, Gemini, ...)
    message and notify each other. The hub exposes one machine interface — an HTTP API
    whose messaging model follows ActivityStreams (ADR 0004); every other surface is a
    client of it (ADR 0005): the CLI, a local stdio MCP server run by that CLI, and the
    human console. Identity is issued by the hub and opaque (ADR 0003); descriptive facts
    live in a profile. It must remain generic — no deployment-specific hostnames, IPs,
    secrets, or organisation names in code, docs, or tests; the hub label is config.
    Agent handles are exempt (owner, 2026-07-28).
  languages_frameworks: >
    Python 3.14+ only, managed exclusively with uv (uv sync / uv run / uv add). The
    ambition is to run the latest Python (owner, 2026-08-01): this is an application that
    ships its own interpreter, so falling behind is a defect to fix rather than a state to
    maintain. Adopt each release once it is finished — patch releases behind it and the
    dependency set resolving with no pin — rather than on the day it lands. The same rule
    governs libraries: do not knowingly adopt or hold an old version; a version cap added
    to work around a break is debt with an owner and a removal condition. Libraries: click
    (CLI), litestar (HTTP), msgspec (serialisation), aiosqlite (storage), mcp / FastMCP
    (MCP server, `clients` extra), uvicorn (ASGI), argon2-cffi + cryptography + pyotp
    (credentials, signing, TOTP), segno (QR), jinja2 + markdown (`ui` extra). Build backend
    hatchling + hatch-vcs (version from git tags).
  testing_requirements: >
    pytest only (never unittest), plain test functions, fixtures for shared setup. Tests
    live in /tests mirroring the source layout. The store is a single SQLite file, so the
    whole suite — including end-to-end round-trips — runs against a temp-file database with
    no external services and no gating, in normal CI. Prefer end-to-end coverage over heavy
    mocking. No fixed coverage floor is mandated for this POC-stage project. Regression
    tests from shipped bugfixes are requirements, not archive.
  quality_gates: >
    Four gates must pass before work is complete and are enforced in CI on every push
    and PR: `uv run pytest`, `uv run ruff check`, `uv run ruff format --check`, and
    `uv run pyright`. Prefer auto-fix (ruff --fix) over disabling a rule. Pre-commit
    hooks (ruff check --fix, ruff format, whitespace/eof/yaml) should be installed.
  review_policy: >
    Trunk-based on `main`; CI must be green (all four gates) before merge. Conventional
    commit prefixes (feat/fix/docs/test/chore). Commit and push eagerly in small,
    focused steps. Changes to public behaviour must update docs in the same change.
    Ship early, ship often (owner, 2026-08-01): a work package that passes its four gates
    and its Directive 4 outside review is released and deployed before the next one starts.
    "Shipped" means running on both hubs and proved by `agent-inbox verify-deployment` — a
    tag is not shipped. The unit that ships is whatever is coherent when running, which is
    not always one work package.
  performance_targets: >
    No hard latency targets; this is a low-throughput coordination tool. Storage is local
    SQLite in WAL mode, opened by exactly one process — the server (ADR 0005). Clients
    reach it over HTTP and have no --db escape hatch. Volume is not a constraint and will
    not become one (ADR 0006).
  deployment_constraints: >
    Releasable via PyPI (Trusted Publishing / OIDC on v* tags) and as a multi-arch Docker
    image (linux/amd64 + linux/arm64) pushed to Docker Hub with a GHCR mirror. No external
    services: storage is a single SQLite file — mount a /data volume so it persists. No
    secrets in the repo.
  documentation_policy: >
    README is the front door; doc/ holds the hosting guide, MCP-client setup, the
    agent-onboarding page, the "check your inbox" snippet, and architecture decisions
    under doc/decisions (ADRs). doc/coding-standards.md is the canonical coding
    baseline and AGENTS.md is the project charter summary. Docs must track shipped
    behaviour and must not leak deployment specifics.
  risk_boundaries: >
    Most costly failures: silently dropping, double-processing, or disclosing a message,
    and leaking deployment-specific or secret material into the public repo. Durability and
    idempotency are the SQLite store's job — there is one delivery mode: every matching
    agent receives its own copy, tracked per-reader in broadcast_reads. Visibility is per
    turn, not per thread. All messaging logic lives server-side in one core; no client
    duplicates it, and no client outside the server process opens the database. ADRs
    0003-0006 are binding. Follow the coding standards (doc/coding-standards.md): full type
    annotations, absolute imports, specific exceptions from a project-level exceptions
    module, logging over print, config through one settings object read from the
    AGENT_INBOX_* environment prefix (the project does not use pydantic), frozen immutable
    data where practical, and current dependencies.
  amendment_process: >
    charter.md is the source. Edit it, run `spec-kitty charter sync`, commit. Do not run
    `spec-kitty charter generate` — it rebuilds charter.md from this file, discarding every
    hand-refresh made since the bootstrap interview. AGENTS.md mirrors the binding rules
    for day-to-day agent reference.
  exception_policy: >
    Deviations from the coding-standards baseline must be documented with their reason
    in AGENTS.md under project-specific overrides. `except Exception:` is permitted
    only at process boundaries (CLI main, HTTP handler) as a logging backstop.
