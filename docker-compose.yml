# Deploy the agent-inbox hub and its console from the official release image.
#
#   docker compose pull && docker compose up -d
#
# `:latest` is only ever an official release (a v* tag) — a plain merge to main
# publishes `:edge`, never `:latest` — so `pull` here always brings a released build,
# not an in-progress one. Pin AGENT_INBOX_VERSION to a specific release (e.g. 0.2.0)
# when you want to control exactly what runs.
#
# Two services from ONE image (they are the same program, run in two modes):
#   agent-inbox    — the hub. Owns the SQLite file on a named volume. The only stateful
#                    part; the only thing with a volume.
#   console        — the human web UI. A client. No volume, no database, no credential —
#                    it reads the hub over HTTP like any other client and cannot reach
#                    the store even if it wanted to (nothing is mounted). Remove it and
#                    the hub is untouched.
#
# Set AGENT_INBOX_PUBLIC_URL to how agents actually reach the hub from where THEY run
# (its LAN name/IP and port). It is baked into every identifier and prompt the hub hands
# out, so a wrong value sends agents nowhere.

services:
  agent-inbox:
    image: salimfadhley/agent-inbox:${AGENT_INBOX_VERSION:-latest}
    # To build locally instead of pulling, comment out `image:` and uncomment:
    # build: .
    restart: unless-stopped
    ports:
      - "${AGENT_INBOX_PORT:-8080}:8080"
    environment:
      # No default that pretends to know the answer: the hub cannot guess how it is
      # reached, and a wrong value would be wrong in every identifier it emits. localhost
      # is the honest fallback; override it for a real deployment.
      AGENT_INBOX_PUBLIC_URL: ${AGENT_INBOX_PUBLIC_URL:-http://localhost:8080}
      AGENT_INBOX_HUB_NAME: ${AGENT_INBOX_HUB_NAME:-agent-inbox}
      # Authentication (ADR 0010). Default off = trust the header (LAN). Migrate a live
      # hub off -> warn -> enforce. SECRET_KEY encrypts TOTP secrets at rest and must be
      # stable across restarts; supply it from the environment, never the repo.
      AGENT_INBOX_AUTH_MODE: ${AGENT_INBOX_AUTH_MODE:-off}
      AGENT_INBOX_SECRET_KEY: ${AGENT_INBOX_SECRET_KEY:-}
      # A standing low-security mode: set it and `admin` signs in with no second factor,
      # at any time. Empty by default, and it should stay empty on anything real — it
      # exists for recovering a hub whose authenticator is lost, and for a throwaway hub
      # in CI that must obtain a credential with no stored secret. A hub running it
      # advertises `adminPasswordSet`, so nothing has to guess.
      AGENT_INBOX_ADMIN_PASSWORD: ${AGENT_INBOX_ADMIN_PASSWORD:-}
    volumes:
      - agent-mailbox-data:/data

  console:
    image: salimfadhley/agent-inbox:${AGENT_INBOX_VERSION:-latest}
    # ENTRYPOINT is `agent-inbox`; this selects the console mode instead of `serve`.
    command: ["console", "--host", "0.0.0.0", "--port", "8090"]
    restart: unless-stopped
    depends_on:
      # Wait for the hub's healthcheck, not just for its container to exist. The console
      # claims its own mailbox once at startup; if it raced ahead of a not-yet-ready hub
      # that join would quietly fail and compose/inbox would not work until a restart.
      agent-inbox:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-8082}:8090"
    environment:
      # Over the compose network the hub is reachable by its service name. The console
      # still advertises the hub's *public* id on its prompt page, not this internal
      # address — that distinction is deliberate (a sidecar reaches the hub by a name no
      # agent could use).
      AGENT_INBOX_HUB: http://agent-inbox:8080
      AGENT_INBOX_NAME: console
      # The image's healthcheck defaults to the hub's port. This mode listens on 8090,
      # so without this the console reports `unhealthy` forever while serving perfectly.
      AGENT_INBOX_HEALTH_PORT: "8090"
    # No volume. That absence is the guarantee: the console cannot touch the store.

volumes:
  # NOT renamed with everything else: this names live data. A new name
  # would create an empty volume and leave the mail in the old one.
  agent-mailbox-data:
