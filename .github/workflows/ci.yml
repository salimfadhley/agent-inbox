name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]  # so a release tag is gated by the same suite before its image builds
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style and types run once. So do the tests: this is an application, not a library —
  # it ships its own interpreter and owes nobody multi-version support, so a matrix here
  # would test a configuration nobody runs. The charter settles it (Languages/Frameworks).
  # pyright needs the clients extra installed (see below); pytest does not, which is why
  # they are separate jobs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (with the clients extra, for pyright)
        # `--extra clients` matters: mcp_client.py imports `mcp`, which lives in the
        # clients extra, not the dev group. Without it pyright cannot resolve the import
        # and fails on code that is fine — the hub image omits these deps deliberately
        # (ADR 0009), but the type check covers the whole source tree.
        run: uv sync --python 3.14 --dev --extra clients

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (pyright)
        # Pinned to the exact version the project's gate uses, and run via `uv run` so it
        # analyses the project venv (where mcp is installed) rather than an isolated one.
        run: uv run --with pyright==1.1.411 pyright src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        # With the clients extra: the MCP server module is only importable with
        # it, and an import-time error there is a crash on launch that no other
        # test can see — which is exactly how one shipped.
        run: uv sync --python 3.14 --dev --extra clients

      - name: Tests (pytest)
        run: uv run pytest

  # Live smoke: build the real image, run the deploy topology (hub + console sidecar),
  # and hit it over HTTP. This catches what the unit suite structurally cannot — that the
  # image starts, the ASGI server serves, the routes are wired into the app that ships,
  # and the console can reach the hub. Every past live break was of exactly this shape
  # and passed every unit test. Because the release build (docker.yml) only fires after
  # CI is green, this gates the release on the stack actually working.
  smoke:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the image (single-arch, for speed)
        # Tagged as the name compose expects, so `compose up` uses this local build
        # rather than pulling. VERSION is cosmetic here; the smoke test does not assert
        # on it.
        # The tag must match the `image:` in docker-compose.yml exactly, or compose
        # ignores this build and pulls that name from Docker Hub instead — silently
        # smoke-testing a published image rather than the one under test. That is not
        # hypothetical: renaming the image to agent-inbox without changing this line
        # made the console sidecar start the hub, and the job failed with a message
        # about the console being slow.
        run: docker build --build-arg VERSION=0.0.0 -t salimfadhley/agent-inbox:latest .

      - name: Launch the stack (hub + console sidecar)
        env:
          AGENT_MAILBOX_PUBLIC_URL: http://localhost:8080
        run: docker compose up -d

      - name: Wait for the hub to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "hub is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::the hub did not become healthy in 60s"
          docker compose ps
          docker compose logs
          exit 1

      - name: Wait for the console
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8082/ >/dev/null 2>&1; then
              echo "console is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::the console did not answer in 40s"
          docker compose logs console
          exit 1

      - name: Run the live smoke tests
        env:
          LIVE_HUB_URL: http://localhost:8080
          LIVE_CONSOLE_URL: http://localhost:8082
        run: uv run pytest tests/live -v

      - name: Tear down the open stack
        run: docker compose down -v

      # ---- second pass: the same topology, enforcing authentication ----
      #
      # Both of our hubs enforce, so a suite only ever run against an open one is a
      # suite that has never seen production. This is the pass that proves the shipped
      # image enforces, that the bootstrap works, and that the suite tells the truth
      # about either kind of hub.
      #
      # **The same compose file, with the environment overridden** — not a second file.
      # The compose topology is itself part of what this job validates, and a second
      # definition would mean the thing under test is not the thing that ships. The
      # image is reused, so there is no second build (NFR-003).
      - name: Launch the stack, enforcing
        env:
          AGENT_MAILBOX_PUBLIC_URL: http://localhost:8080
          AGENT_INBOX_AUTH_MODE: enforce
        run: |
          # Generated per run and never stored. The hub is created for this job and
          # destroyed with it, so the admin override is a throwaway credential rather
          # than a secret — which is the whole point: no repository credential, and
          # nothing configured in CI that could outlive the run.
          {
            echo "AGENT_INBOX_SECRET_KEY=$(openssl rand -base64 32)"
            echo "AGENT_INBOX_ADMIN_PASSWORD=$(openssl rand -base64 24)"
          } >> "$GITHUB_ENV"

      - name: Bring it up
        env:
          AGENT_MAILBOX_PUBLIC_URL: http://localhost:8080
          AGENT_INBOX_AUTH_MODE: enforce
        run: docker compose up -d

      - name: Wait for the enforcing hub
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "hub is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::the enforcing hub did not become healthy in 60s"
          docker compose logs
          exit 1

      - name: Run the live smoke tests against an enforcing hub
        env:
          LIVE_HUB_URL: http://localhost:8080
          # LIVE_CONSOLE_URL is deliberately absent: the console sidecar has no
          # credential of its own on an enforcing hub, which is its own mission.
          LIVE_AUTH: "1"
          # Fails the pass if it ends up running unauthenticated — otherwise this is a
          # duplicate of the pass above wearing a different name (FR-010).
          LIVE_REQUIRE_AUTH: "1"
        run: |
          LIVE_ADMIN_PASSWORD="$AGENT_INBOX_ADMIN_PASSWORD" uv run pytest tests/live -v

      - name: Stack logs (always, for debugging a failure)
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
