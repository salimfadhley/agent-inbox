name: Release

# On a v* tag: build the Python distributions and, if opted in, publish to PyPI.
#
# The Docker image is the artifact you deploy — see docker.yml, which builds :X.Y.Z +
# :latest on the same tag. This workflow is about PyPI, which is optional for an
# experimental tool and OFF by default so a tag never fails for want of PyPI setup.
#
# To turn PyPI publishing on:
#   1. Repo -> Settings -> Secrets and variables -> Actions -> Variables:
#        add PUBLISH_PYPI = true
#   2. One-time Trusted Publishing on PyPI (https://pypi.org -> Your projects ->
#      Publishing; create a pending publisher if the project does not exist yet):
#        Owner: salimfadhley · Repository: agent-inbox · Workflow: release.yaml
#        Environment: pypi
#   3. Push a tag (the version comes from it via hatch-vcs):
#        git tag v0.2.0 && git push origin v0.2.0
#
# With PUBLISH_PYPI unset, the build job still runs and uploads the wheel/sdist as
# workflow artifacts, so a release is downloadable from GitHub. When PyPI publishing is
# enabled, this workflow verifies that the exact released package is visible to the same
# resolver agents use before it declares the publish complete.

# Gated on CI, exactly as docker.yml is. This used to trigger straight off the tag, so
# PyPI published whether or not the code worked: 0.13.3 went out that way while CI was
# red, and shipped no images at all — a version that exists on PyPI and nowhere else.
# One release now means one gate, and the same gate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  build:
    # Only a v* tag whose CI passed. `workflow_run` carries the original event, and for
    # a tag push `head_branch` is the tag name.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI validated, not whatever the branch is now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # full history + tags for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    # Off unless explicitly opted in, so a plain tag push does not fail for want of the
    # one-time PyPI trusted-publisher setup.
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # full history + tags for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Compute version (hatch-vcs — the same one PyPI gets)
        id: version
        run: echo "pep440=$(uvx --with hatch-vcs hatch version)" >> "$GITHUB_OUTPUT"

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI can satisfy the exact release artifact
        run: >-
          uv run python -m agent_mailbox.release_gate
          --check release-artifact
          --version "${{ steps.version.outputs.pep440 }}"
